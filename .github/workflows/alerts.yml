name: Edge alerts

# Pushes the bets Your card would make — anytime TD AND player props (receptions, receiving / rushing / rush+rec / passing
# yards; props since 2026-11-06, user: "ntfy is only sending td picks") — to your phone (ntfy) for EVERY game on the board
# (ALERT_HOURS 168 — since 2026-11-05, user: "i want to catch all nfl bets"; was the next 6 hours). It never places a bet.
# Credits: 1 per market per game that has prices. Anytime TD every run within 6 h of kickoff, every 25 min within 24 h, every
# 85 min within 72 h, every 3 h before that (TD_EVERY, 2026-11-11); props (5 markets) every run within 6 h of kickoff,
# hourly within 24 h, every 3 h within 72 h, every 6 h before that. The cache below carries each game's last prop prices from
# run to run, so between prop checks the card still knows them. Quiet hours 10 PM - 6 AM Eastern (ALERT_QUIET): those runs
# check nothing. Setup and settings: README.md → "📲 Edge alerts".
# Script: alerts/watch.mjs.
on:
  workflow_dispatch:        # "Run workflow" button on the repo's Actions tab
    inputs:
      mode:
        description: 'test = one test alert (no odds, no credits) · dry = check prices and print, send nothing · live = check and send'
        type: choice
        options: [test, dry, live]
        default: test
  # TIMER: every 30 min since 2026-11-05 (15 min works too — set in the cron-job.org job). GitHub runs this account's timed jobs hours late, so the reliable trigger is an
  # outside timer (cron-job.org) calling this workflow's dispatch API every 30 min; this 2-hour schedule is only a backup,
  # and it does nothing when a run happened in the last 25 minutes. To stop everything: pause the cron-job.org job AND put
  # # back in front of the next 2 lines.
  schedule:
    - cron: '17 */2 * * *'   # backup only

permissions:
  contents: read

concurrency:
  group: edge-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            alerts
            nfl-td-snapshot.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # the last run's memory: each game's prop prices and when they were pulled, forecasts, when the last run was
      - name: Restore the last run's prices
        uses: actions/cache/restore@v4
        with:
          path: alerts-cache
          key: alerts-cache-${{ github.run_id }}
          restore-keys: alerts-cache-

      - name: Check prices and alert
        id: check
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          ALERT_MODE: ${{ inputs.mode || 'live' }}
          ALERT_HOURS: '168'   # every game on the board (a week ahead) — = LOOKAHEAD_H in the app (⚡ Pull all games), keep equal
          ALERT_MAX: '20'      # up to 20 alerts a run (the rest go next run)
          ALERT_BOOKS: 'fanduel,draftkings,betmgm,williamhill_us,fanatics'   # your five books, as in the app (2026-11-05)
          ALERT_PROPS: 'on'    # 'off' = anytime TD only
          ALERT_RESERVE: '1000'           # below this many credits left: no checks at all
          ALERT_PROP_RESERVE: '10000'     # below this: no prop checks (TD goes on)
          ALERT_QUIET: '22-6'             # quiet hours, Eastern: no checks 10 PM - 6 AM (2026-11-06, user's ask); '' = around the clock
          ALERT_STATE: ${{ vars.ALERT_STATE }}
          ALERT_CACHE: alerts-cache/state.json
          ALERT_TRIGGER: ${{ github.event_name }}
        run: node alerts/watch.mjs

      - name: Keep the prices for the next run
        if: steps.check.outputs.saved == 'true'   # only after a live run that checked prices (not quiet hours / test / dry)
        uses: actions/cache/save@v4
        with:
          path: alerts-cache
          key: alerts-cache-${{ github.run_id }}-${{ github.run_attempt }}
