name: Edge alerts

# Pushes the anytime-TD bets Your card would make to your phone (ntfy) for EVERY game on the board (ALERT_HOURS 168 — since
# 2026-11-05, user: "i want to catch all nfl bets"; was the next 6 hours).
# It never places a bet. Costs 1 Odds API credit per game per check; with no game inside the window a run costs nothing.
# Setup and settings: README.md → "📲 Edge alerts". Script: alerts/watch.mjs.
on:
  workflow_dispatch:        # "Run workflow" button on the repo's Actions tab
    inputs:
      mode:
        description: 'test = one test alert (no odds, no credits) · dry = check prices and print, send nothing · live = check and send'
        type: choice
        options: [test, dry, live]
        default: test
  # TIMER: every 30 min (2026-11-05). GitHub runs this account's timed jobs hours late, so the reliable trigger is an
  # outside timer (cron-job.org) calling this workflow's dispatch API every 30 min; this 2-hour schedule is only a backup. To stop
  # everything: pause the cron-job.org job AND put # back in front of the next 2 lines.
  schedule:
    - cron: '17 */2 * * *'   # backup only: every 2 h, so it can't double the outside timer's cost

permissions:
  contents: read

concurrency:
  group: edge-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            alerts
            nfl-td-snapshot.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check prices and alert
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          ALERT_MODE: ${{ inputs.mode || 'live' }}
          ALERT_HOURS: '168'   # every game on the board (a week ahead)
          ALERT_MAX: '20'      # up to 20 alerts a run (the first run of a week can find many)
          ALERT_BOOKS: 'fanduel,draftkings,betmgm,williamhill_us,fanatics'   # your five books, as in the app (2026-11-05)
          ALERT_RESERVE: '1000'
          ALERT_STATE: ${{ vars.ALERT_STATE }}
        run: node alerts/watch.mjs
